[workspace]
members = [
    "crates/forge-kernel",
    "crates/forge-content",
    "crates/forge-replay",
    "crates/forge-cli",
    "crates/forge-server",
    "crates/forge-verify",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
