name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mechanical-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install pinned browser toolchain
        uses: actions/setup-node@v7
        with:
          node-version-file: browser/.node-version
          package-manager-cache: false

      - name: Install locked-player sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap binutils patch
          bwrap --version

      - name: Run verification bar
        run: ./verify
