[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
forge-content = { path = "../forge-content" }
forge-kernel = { path = "../forge-kernel" }
forge-replay = { path = "../forge-replay" }
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }

[dev-dependencies]
futures-core = "0.3"
tower = { version = "0.5", features = ["util"] }
